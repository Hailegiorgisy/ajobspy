[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ajobspy"
version = "0.2.0"
description = "Asynchronous Python toolkit for job market data extraction with resilient adapters."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Hailegiorgis Yirgu", email = "hgyirgu1@gmail.com"}
]
dependencies = [
  "httpx>=0.24.0",
  "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0"
]
